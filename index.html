<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f9f5ee" />
    <meta name="description" content="Voisin : prêtez, empruntez et donnez des objets entre voisins." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Manrope:wght@400;500;600;700;800&display=swap"
    />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <title>Voisin</title>
    <style>
      /* Opening screen (logo A "Le toit"), shown before the app loads. */
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: grid; place-items: center; text-align: center;
        background: #24604f; color: #fff;
        font-family: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
        transition: opacity 0.35s ease-out, visibility 0.35s;
      }
      #splash.is-hidden { opacity: 0; visibility: hidden; }
      #splash .stack { display: grid; justify-items: center; gap: 14px; padding: 0 24px; }
      #splash svg polyline { fill: none; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
      #splash .roof { stroke: #e75723; stroke-dasharray: 112; animation: splash-draw 0.7s 0.2s ease-out both; }
      #splash .vee { stroke: #fff; stroke-dasharray: 104; animation: splash-draw 0.7s 0.75s ease-out both; }
      #splash .roof { --len: 112; } #splash .vee { --len: 104; }
      #splash .wordmark { font-weight: 800; font-size: 40px; letter-spacing: -0.02em; line-height: 1; animation: splash-rise 0.6s 1.3s ease-out both; }
      #splash .tagline { font-family: "Manrope", "Avenir Next", system-ui, sans-serif; font-weight: 600; font-size: 14px; color: rgb(255 255 255 / 0.75); max-width: 20ch; animation: splash-rise 0.6s 1.5s ease-out both; }
      #splash .dots { position: absolute; bottom: calc(40px + env(safe-area-inset-bottom)); display: flex; gap: 8px; }
      #splash .dots i { width: 8px; height: 8px; border-radius: 50%; background: #e75723; animation: splash-pulse 1.2s ease-in-out infinite both; }
      #splash .dots i:nth-child(2) { animation-delay: 0.15s; }
      #splash .dots i:nth-child(3) { animation-delay: 0.3s; }
      @keyframes splash-draw { from { stroke-dashoffset: var(--len); } }
      @keyframes splash-rise { from { opacity: 0; transform: translateY(8px); } }
      @keyframes splash-pulse { 0%, 100% { opacity: 0.35; transform: scale(0.85); } 50% { opacity: 1; transform: scale(1); } }
      @media (prefers-reduced-motion: reduce) {
        #splash *, #splash { animation: none !important; transition: none !important; }
      }
    </style>
  </head>

  <body>
    <div id="splash" aria-hidden="true">
      <div class="stack">
        <svg width="128" height="128" viewBox="0 0 120 120">
          <polyline class="roof" points="18,54 60,20 102,54" />
          <polyline class="vee" points="34,58 60,98 86,58" />
        </svg>
        <div class="wordmark">Voisin</div>
        <div class="tagline">Prêter, emprunter, donner entre voisins</div>
      </div>
      <div class="dots"><i></i><i></i><i></i></div>
    </div>
    <div id="root"></div>

    <script type="module" src="/client/App.tsx"></script>
  </body>
</html>
