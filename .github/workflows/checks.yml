# Checks every pull request and every merge into main: types, tests, build.
# The app itself is deployed by Vercel.
name: Vérifier

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Known vulnerabilities in what ships to the browser (dependencies).
      # Build and test tools (devDependencies) are kept up to date by Dependabot.
      - run: pnpm audit --prod

      - run: pnpm typecheck

      - run: pnpm test

      - run: pnpm build

  # Isolation between residences: every migration on a throwaway Postgres,
  # then supabase/tests/isolation.sql (plan 8.6).
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7

      - run: bash supabase/tests/run.sh
