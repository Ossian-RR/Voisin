# Once a month, at most three pull requests for the app's packages: minor and
# patch updates of what ships to the browser (appli), the same for build and
# test tools (outils), and every major version together (majeures, to test
# before merging). Security fixes do not wait: they come as soon as GitHub
# publishes them. One grouped pull request per kind means no more conflicts
# between two Dependabot pull requests that both change pnpm-lock.yaml.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    groups:
      appli:
        dependency-type: production
        update-types: [minor, patch]
      outils:
        dependency-type: development
        update-types: [minor, patch]
      majeures:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
